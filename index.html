  :root {

  html { transition: background-color var(--transition); }
  body, .sidebar, header, .panel, .status-bar, form, .chip, .bubble, .tcard, .file-row, .dec-card {

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

    display: flex; flex-direction: column; overflow: hidden;
    font: 13.5px/1.55 ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    background: var(--bg); color: var(--text);

  /* layered neon backdrop — sits behind the whole app, drifts slowly */
  body::before {
    content: ''; position: fixed; inset: -25%; z-index: -2; pointer-events: none;
    background:
      radial-gradient(38% 48% at 18% 20%, rgba(var(--t-pos-rgb),.13), transparent 62%),
      radial-gradient(36% 44% at 84% 16%, rgba(var(--t-neg-rgb),.09), transparent 62%),
      radial-gradient(46% 54% at 72% 86%, rgba(var(--t-zero-rgb),.10), transparent 64%),

    filter: blur(10px); animation: bgDrift 34s ease-in-out infinite alternate;
  }
  body::after {
    content: ''; position: fixed; inset: 0; z-index: -2; pointer-events: none; opacity: .5;
    background-image:
      linear-gradient(rgba(125,160,205,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(125,160,205,.035) 1px, transparent 1px);
    background-size: 46px 46px;
    -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 45%, #000 25%, transparent 82%);

  @keyframes bgDrift {

    to   { transform: translate3d(2%, 1.5%, 0) scale(1.12); }

  /* Reduced motion (improve.md #42): collapse all animation/transition to imperceptible */

    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
      scroll-behavior: auto !important;
    }
    body::before { animation: none; }
  }

  /* ── Scrollbars ── */

  /* ── Workspace ── */

  /* Header fit: backend / branch / session live in the ⋯ popover; labels shrink with the HEADER's width (a container

    padding: 7px 10px; font-size: 11.5px; background: var(--bg); border: 1px solid var(--border-1); border-radius: 8px; box-shadow: var(--shadow-lg, 0 8px 30px rgba(0,0,0,.45)); }

  .offline-banner { display: flex; align-items: center; gap: 10px; padding: 7px 14px; flex-shrink: 0; font-size: 12px; font-weight: 600;

    .cmp-bar > .cmp-act { height: 40px; padding: 0 14px; margin-left: 2px; }
    .cmp-kbd, .cmp-arrow, .cmp-busy-l, .cmp-act.stop .cmp-l { display: none; }   /* phone: the dot alone says "working"; Stop = the red ■ square (aria-label keeps the word) */
    .cmp-bar > .cmp-act.stop { width: 40px; padding: 0; justify-content: center; }
    .cmp-busy { display: none; }                          /* the animated card border already says "working" */
    .proj-chip { max-width: 120px; height: 30px; padding: 0 8px 0 7px; gap: 4px; }
    .todos { margin: 4px 8px 6px; }
    .todos-head { min-height: 38px; }
    .panel > .slash-menu { margin-left: 8px; margin-right: 8px; }
    .status-bar .sb-todos { display: none; }               /* the plan card already shows it */
    .status-bar .sb-conn + .sb-item::before { display: none; }
    form input, form .composer-ta { font-size: 16px; }   /* ≥16px stops iOS Safari auto-zoom */
    form button { padding: 7px 12px; }
    .slash-menu { max-height: 50vh; }
    /* Comfortable tap targets */
    .sb-btn, .ph-btn, .icon-btn, .tab, .term-tab, .sb-sess { min-height: 38px; }
    .sb-btn, .ph-btn, .icon-btn { min-width: 38px; justify-content: center; }
    .log { padding: 10px; }
    .bubble { max-width: 100%; }
    /* Terminal info bar: the PTY size + "type here" hints wrap into a multi-line mess on a
       phone (no spare width); drop them and keep only the action buttons + position chip. */
    .vt-bar { flex-wrap: wrap; row-gap: 4px; }
    .vt-bar .muted { display: none; }
  }
  /* B5b: inline images, link hover, find, tab rename/drag/busy */
  .vt-imgs, .vt-hover, .vt-findhl { position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; overflow: hidden; }
  .vt-imgs img { position: absolute; object-fit: contain; object-position: left top; }
  .vt-hover > div { position: absolute; border-bottom: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .vt.has-link, .vt.has-link .vt-grid { cursor: pointer; }
  .vt-findhl > div { position: absolute; background: rgba(255, 220, 0, .28); outline: 1px solid rgba(255, 220, 0, .5); }
  .vt-findhl > div.cur { background: color-mix(in srgb, var(--accent) 55%, transparent); outline-color: var(--accent); }
  .vt-find { position: absolute; top: 4px; right: 12px; display: flex; gap: 4px; align-items: center; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--border-1); background: var(--bg-2); box-shadow: 0 4px 14px rgba(0, 0, 0, .35); z-index: 3; }
  .vt-find input { font: inherit; font-size: 12px; width: 180px; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--border-1); background: var(--bg-1); color: var(--text); }
  .vt-find .cnt { font-size: 11px; color: var(--text-2); min-width: 34px; text-align: center; }
  .vt-find button { font: inherit; font-size: 12px; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--border-1); background: var(--bg-2); color: var(--text); cursor: pointer; }
  .term-tab .busy-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: 2px; animation: vt-busy 1.1s ease-in-out infinite; }
  @keyframes vt-busy { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  .term-tab.dragover { outline: 1px dashed var(--accent); outline-offset: -1px; }
  .tab-rename { font: inherit; font-size: 12px; width: 110px; padding: 1px 4px; border-radius: 4px; border: 1px solid var(--accent); background: var(--bg-1); color: var(--text); }
  /* B6a: ask modal, jump-to-latest pill */
  .modal.ask { width: 440px; }
  .ask-body { margin: 0 0 12px; color: var(--text-1); line-height: 1.45; white-space: pre-wrap; }
  .ask-input { width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-1); background: var(--bg-1); color: var(--text); margin-bottom: 12px; }
  .ask-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .ask-actions button { font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border-1); background: var(--bg-2); color: var(--text); cursor: pointer; }
  .ask-actions button.primary { background: var(--accent); color: var(--bg-0, #000); border-color: var(--accent); }
  .ask-actions button.danger { background: var(--red); color: #fff; border-color: var(--red); }
  .float-head, .float-resize { touch-action: none; }
  .jump-latest { position: sticky; bottom: 4px; align-self: flex-end; order: 9999; height: 24px; margin: -24px 0 0; flex: none; font: inherit; font-size: 11px; padding: 0 9px; border-radius: 999px; border: 1px solid var(--border-1); background: var(--bg-2); color: var(--text); box-shadow: 0 4px 14px rgba(0,0,0,.35); cursor: pointer; z-index: 2; }
  .jump-latest:hover { border-color: var(--accent); }
  /* B6b: windowed log */
  .log-earlier { align-self: center; font: inherit; font-size: 12px; padding: 6px 14px; border-radius: 999px; border: 1px dashed var(--border-1); background: var(--bg-2); color: var(--text-2); cursor: pointer; }
  .log-earlier:hover { color: var(--text); border-color: var(--accent); }
  /* B6c: palette kinds + transcript hits, jump flash */
  .palette-item .pi-kind { flex-shrink: 0; font-size: 9px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 4px; }
  .palette-item .pi-kind.hit { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .palette-item .pi-kind.live { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); }
  .msg.flash { animation: msgflash 1.6s ease-out; border-radius: var(--radius); }
  @keyframes msgflash { 0% { background: color-mix(in srgb, var(--accent) 22%, transparent); } 100% { background: transparent; } }
  /* B6c: settings — chat text size, custom instructions, tool toggles */
  .log .bubble { font-size: var(--chat-font-size, 1em); }
  .instr { width: 100%; box-sizing: border-box; font: inherit; font-size: 12.5px; line-height: 1.4; padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-1); color: var(--text); resize: vertical; }
  .tool-toggles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 2px 10px; }
  .tool-toggles .tool-tg span { font-family: ui-monospace, monospace; font-size: 11.5px; }
  .tool-toggles.perms { grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); }
  .tool-toggles.perms .tool-tg { display: flex; align-items: center; gap: 6px; }
  .tool-toggles.perms .tool-tg > span { flex: 1; }
  .perm-sel { font: inherit; font-size: 11px; padding: 1px 4px; border-radius: 6px; background: var(--bg-2); color: var(--text-2); border: 1px solid var(--border-1); max-width: 92px; }
  .perm-sel.allow { color: var(--green); } .perm-sel.ask { color: var(--amber, #ffb340); } .perm-sel.deny { color: var(--red); }
  .brg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
  .brg-grid .sub, .field.brg .sub { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; color: var(--text-2); }
  .brg-grid .sub select, .brg-grid .sub input { font: inherit; font-size: 12.5px; }
  .chip.act { cursor: pointer; border: 1px solid var(--border-1); font: inherit; font-size: inherit; line-height: inherit; }
  .chip.act:hover { border-color: var(--accent); }
  .chip.think.off { opacity: .6; }
  /* contents: the generic `form` rule (composer padding 10px 12px + border + glass) made the header 59 px tall when gated */
  .logout-form { display: contents; margin: 0; }
  .logout-form .icon-btn { flex-shrink: 0; }
  .sb-sess .dl:hover { color: var(--accent); }
  /* B6c: tool-card result formatting, reasoning caret, labelled chips */
  .tc-meta { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 6px; }
  .tc-chip { font-size: 10px; font-family: ui-monospace, monospace; color: var(--text-1); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; background: var(--bg-1); }
  .tc-chip b { font-weight: 600; color: var(--text-2); margin-right: 4px; }
  .tc-chip.bad { border-color: color-mix(in srgb, var(--red) 50%, transparent); color: var(--red); }
  .tc-err { color: var(--red); font-size: 12px; white-space: pre-wrap; word-break: break-word; margin: 0 0 6px; }
  .reasoning > summary::before { content: "▸ "; } .reasoning[open] > summary::before { content: "▾ "; }
  .chip-k { font-size: 9px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-2); }
</style>

<!-- The agent: system prompt + tool schemas + agentic loop + UI. Plain JS, no build. -->
<script>
(function () {
  "use strict";
  var preact = self.preact, htm = self.htm;
  var h = preact.h, render = preact.render, Component = preact.Component;
  var html = htm.bind(h);
  var CFG = window.__HERMES__;

  // The bridge injects its own process-wide SESSION_ID, but that id is shared by EVERY tab —
  // two windows against the same bridge would clobber each other's rows (INSERT OR REPLACE on
  // (session_id, idx), each with its own seq). Instead the PAGE owns its identity
  // (improve.md #6): sessionStorage keys the session to this tab — a refresh resumes it,
  // "new agent window" gets a fresh one (sessionStorage does not propagate to window.open).
  // Caveat: some browsers COPY sessionStorage on "Duplicate Tab", so a duplicated tab may
  // briefly share the session until /new is used. The bridge's id remains the REPL's session.
  try {
    var _tabSess = sessionStorage.getItem("iris_session");
    if (!_tabSess) {
      // sessionStorage lost (new tab, mobile purge, crash): a FIRST tab resumes the last-active session kept in
      // localStorage; "new agent window" tabs (window.name "iris_fresh_*") and ＋ new chat always start clean.
      var _fresh = /^iris_fresh_/.test(window.name || "");
      try { if (!_fresh) _tabSess = localStorage.getItem("iris_last_session") || ""; } catch (e) { _tabSess = ""; }
      if (!_tabSess) _tabSess = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()));
      sessionStorage.setItem("iris_session", _tabSess);
    }
    CFG.session = _tabSess;
  } catch (e) { /* sessionStorage unavailable — fall back to the bridge-injected id */ }

  // Runtime-tunable knobs (improve.md #48) — Settings can change both; device-local.
  var MAX_ITERS = (function () { try { var v = parseInt(localStorage.getItem("iris_max_iters"), 10); return v >= 1 && v <= 200 ? v : 24; } catch (e) { return 24; } })();
  var TEMP = (function () { try { var v = parseFloat(localStorage.getItem("iris_temp")); return v >= 0 && v <= 2 ? v : 0.7; } catch (e) { return 0.7; } })();
  // Tools that are READ-ONLY and independent — safe to run concurrently within one turn
  // (upstream runs tool calls on a ThreadPool cap 8). Anything that writes the filesystem,
  // mutates shared UI state, drives the shared PTY, or pauses the loop stays sequential.
  var PARALLEL_SAFE = { read_file: 1, search_files: 1, web_search: 1, web_extract: 1, session_search: 1, skills_list: 1, skill_view: 1 };
  var PARALLEL_CAP = 6;     // max concurrent tool calls in a parallel batch
  var SUB_MAX_ITERS = 14;   // per-sub-agent iteration budget (bounded so fan-out can't run away)
  var SUB_FANOUT_CAP = 6;   // max sub-agents per delegate_task call
  // Lean, task-focused system prompt for delegated sub-agents (no memory/skills/clarify — they
  // run autonomously and cannot ask the user). The parent's `delegate_task` hands each a complete,
  // self-contained instruction; the sub-agent does real work then returns a concise report.
  var SUB_SYSTEM = "You are a focused autonomous sub-agent spawned by a parent agent to complete ONE specific delegated task. You work independently and CANNOT ask the user questions — make reasonable assumptions and proceed. Use your tools to do real work (inspect files, run commands, edit, search, fetch the web). When the task is complete, STOP calling tools and reply with a concise report: what you did, the key findings/answers, and any files you changed. You have a limited iteration budget, so be efficient and avoid redundant steps. The filesystem, working directory, and exported environment persist between terminal calls.";

  // Preconfigured OpenAI-compatible providers for the /model picker (like upstream Hermes'
  // provider catalog). Picking one fills the base URL + a model dropdown; the user supplies the
  // key. Only chat/completions is wired — Anthropic-native /v1/messages is not yet supported.
  var PROVIDERS = [
    { id: "bonsai-pre", label: "Bonsai pre-release (default · 2B/4B/9B)", base: "https://pre.bonsai.stream/v1",
      models: ["bonsai-9b", "bonsai-4b", "bonsai-2b"], keyHint: "your Bonsai API key" },
    { id: "bonsai", label: "Bonsai 27B", base: "https://api.bonsai.stream/v1",
      models: ["bonsai-27b"], keyHint: "your Bonsai API key" },
    { id: "together", label: "Together AI", base: "https://api.together.ai/v1",
      models: ["Prism-ML/Ternary-Bonsai-27B", "zai-org/GLM-4.6", "deepseek-ai/DeepSeek-V3", "Qwen/Qwen2.5-72B-Instruct-Turbo", "meta-llama/Llama-3.3-70B-Instruct-Turbo"], keyHint: "TOGETHER_API_KEY" },
    { id: "openrouter", label: "OpenRouter", base: "https://openrouter.ai/api/v1",
      models: ["stealth/ox-alpha", "zai-org/glm-5.2", "anthropic/claude-opus-4.8", "openai/gpt-4o", "deepseek/deepseek-chat", "meta-llama/llama-3.3-70b-instruct"], keyHint: "OPENROUTER_API_KEY" },
    { id: "wandb", label: "Weights & Biases (Inference)", base: "https://api.inference.wandb.ai/v1",
      models: ["zai-org/GLM-5.2", "zai-org/GLM-4.6", "moonshotai/Kimi-K2-Instruct", "deepseek-ai/DeepSeek-V3.1", "Qwen/Qwen3-235B-A22B-Instruct"], keyHint: "WANDB_API_KEY" },
    { id: "openai", label: "OpenAI", base: "https://api.openai.com/v1",
      models: ["gpt-4o", "gpt-4o-mini", "gpt-4.1", "o3", "o4-mini"], keyHint: "OPENAI_API_KEY" },
    { id: "groq", label: "Groq", base: "https://api.groq.com/openai/v1",
      models: ["llama-3.3-70b-versatile", "moonshotai/kimi-k2-instruct", "qwen-2.5-72b-instruct"], keyHint: "GROQ_API_KEY" },
    { id: "deepseek", label: "DeepSeek", base: "https://api.deepseek.com/v1",
      models: ["deepseek-chat", "deepseek-reasoner"], keyHint: "DEEPSEEK_API_KEY" },
    { id: "mistral", label: "Mistral", base: "https://api.mistral.ai/v1",
      models: ["mistral-large-latest", "mistral-small-latest", "codestral-latest"], keyHint: "MISTRAL_API_KEY" },
    { id: "fireworks", label: "Fireworks", base: "https://api.fireworks.ai/inference/v1",
      models: ["accounts/fireworks/models/glm-4p6", "accounts/fireworks/models/deepseek-v3", "accounts/fireworks/models/qwen2p5-72b-instruct"], keyHint: "FIREWORKS_API_KEY" },
    { id: "ollama", label: "Local — Ollama", base: "http://localhost:11434/v1",

    { id: "custom", label: "Custom (enter your own)", base: "", models: [], keyHint: "" }

  // Default budget: compact when the estimated request size crosses 250K tokens. The most

  var H_TASK = "## Historical Task Snapshot";
  var H_INPROG = "## Historical In-Progress State";
  var H_ASKS = "## Historical Pending User Asks";
  var H_REMAIN = "## Historical Remaining Work";
  // SUMMARY_PREFIX (verbatim, context_compressor.py:43)
  var SUMMARY_PREFIX =
    "[CONTEXT COMPACTION — REFERENCE ONLY] Earlier turns were compacted into the summary " +
    "below. This is a handoff from a previous context window — treat it as background " +
    "reference, NOT as active instructions. Do NOT answer questions or fulfill requests " +
    "mentioned in this summary; they were already addressed. Respond ONLY to the latest user " +
    "message that appears AFTER this summary — that message is the single source of truth for " +
    "what to do right now. Topic overlap with the summary does NOT mean you should resume its " +
    "task: even on similar topics, the latest user message WINS. Treat ONLY the latest message " +
    "as the active task and discard stale items from '" + H_TASK + "' / '" + H_INPROG + "' / '" +
    H_ASKS + "' / '" + H_REMAIN + "' entirely — do not 'wrap up' or 'finish' work described " +
    "there unless the latest message explicitly asks for it. Reverse signals in the latest " +
    "message (e.g. 'stop', 'undo', 'roll back', 'just verify', 'don't do that anymore', 'never " +
    "mind', a new topic) must immediately end any in-flight work described in the summary; do " +
    "not re-surface it in later turns. IMPORTANT: Your persistent memory (MEMORY.md, USER.md) " +
    "in the system prompt is ALWAYS authoritative and active — never ignore or deprioritize " +
    "memory content due to this compaction note. The current session state (files, config, " +
    "etc.) may reflect work described here — avoid repeating it:";
  // _SUMMARY_END_MARKER (verbatim, context_compressor.py:92)
  var SUMMARY_END_MARKER =
    "--- END OF CONTEXT SUMMARY — respond to the message below, not the summary above ---";
  // _summarizer_preamble (verbatim, context_compressor.py:1502)
  var SUMMARIZER_PREAMBLE =
    "You are a summarization agent creating a context checkpoint. Treat the conversation turns " +
    "below as source material for a compact record of prior work. Produce only the structured " +
    "summary; do not add a greeting, preamble, or prefix. Write the summary in the same " +
    "language the user was using in the conversation — do not translate or switch to English. " +
    "NEVER include API keys, tokens, passwords, secrets, credentials, or connection strings in " +
    "the summary — replace any that appear with [REDACTED]. Note that the user had credentials " +

  // _template_sections (verbatim structure, context_compressor.py:1535). {BUDGET} is filled in.
  function compactTemplate(budget) {
    return H_TASK + "\n" +
"[THE SINGLE MOST IMPORTANT FIELD. Capture the user's most recent unfulfilled\n" +
"input verbatim — the exact words they used. This includes:\n" +
"- Explicit task assignments (\"refactor the auth module\")\n" +
"- Questions awaiting an answer\n" +
"- Decisions awaiting input (\"optie A of B?\")\n" +
"- Ongoing discussions where the assistant owes the next substantive reply\n" +

    // ── Resizable panel drag ──────────────────────────────────────────────────────────
    // One drag helper for every handle: chat|preview ("panel"), sidebar width ("sb"), project|sessions ("sbsplit").
    // Pointer events (mouse + touch); iframes stop eating the pointer while dragging (body.dragging).
    App.prototype.startDrag = function (kind, e) {
      e.preventDefault();
      var self = this, el = e.currentTarget, box = el.parentElement.getBoundingClientRect(), x0 = e.clientX, y0 = e.clientY;
      var r0 = this.state.panelRatio, sb0 = this.state.sbW || 260, sp0 = this.state.sbSplit || 0.5;
      document.body.classList.add("dragging"); el.classList.add("active");
      var move = function (ev) {
        if (kind === "panel") self.setState({ panelRatio: Math.max(0.15, Math.min(0.85, r0 + (ev.clientX - x0) / box.width)) });
        else if (kind === "sb") { var w = Math.max(160, Math.min(560, sb0 + ev.clientX - x0)); document.documentElement.style.setProperty("--sb-w", w + "px"); self.setState({ sbW: w }); }
        else if (kind === "sbsplit") self.setState({ sbSplit: Math.max(0.12, Math.min(0.88, sp0 + (ev.clientY - y0) / box.height)) });
      };
      var up = function () {
        document.removeEventListener("pointermove", move); document.removeEventListener("pointerup", up);
        document.body.classList.remove("dragging"); el.classList.remove("active");
        try { localStorage.setItem("iris_layout", JSON.stringify({ panelRatio: self.state.panelRatio, sbW: self.state.sbW, sbSplit: self.state.sbSplit })); localStorage.setItem("iris_panel_ratio", String(self.state.panelRatio)); } catch (e2) {}
        if (kind === "panel") self.fitPty();
      };
      document.addEventListener("pointermove", move); document.addEventListener("pointerup", up);
    };
    App.prototype.startResize = function (e) {
      if (e && e.currentTarget) { this.startDrag("panel", e); return; }
      e.preventDefault();
      var self = this, startX = e.clientX, startRatio = this.state.panelRatio;
      var container = e.target.parentElement;
      var totalW = container.getBoundingClientRect().width;
      function onMove(ev) {
        var ratio = startRatio + (ev.clientX - startX) / totalW;
        ratio = Math.max(0.15, Math.min(0.85, ratio));
        self.setState({ panelRatio: ratio });
      }
      function onUp() {
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
        try { localStorage.setItem("iris_panel_ratio", String(self.state.panelRatio)); } catch (e2) {} // a storage error must not skip fitPty
        self.fitPty();
      }
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    };

    // ── Settings (model/base/key via existing config WS ops) ───────────────────────────
    App.prototype.openSettings = async function () {
      this._grabFocus();
      this.setState({ settingsOpen: true });
      this.refreshIrisCfg();
      requestAnimationFrame(function () { var el = document.querySelector(".modal-bg select, .modal-bg input"); if (el) el.focus(); });
      var resp = await this.wsCall("config_get", {});
      if (resp) {
        // detect which preconfigured provider the current base URL belongs to (for the picker)
        var prov = "custom";
        for (var i = 0; i < PROVIDERS.length; i++) if (PROVIDERS[i].base && resp.base && resp.base.indexOf(PROVIDERS[i].base) === 0) { prov = PROVIDERS[i].id; break; }
        var nsi = { model: resp.model || "", base: resp.base || "", key: "", revealKey: false, provider: prov, persistCfg: this.state.settingsInput.persistCfg !== false, bLabel: "", bUrl: "", bToken: "" };
        this.setState({ settings: resp, settingsInput: nsi, probe: { st: "idle", ms: 0, models: [], detail: "", host: "" } });
        this.scheduleProbe(nsi, resp);        // B11: a stored key for the stored base → list its models right away
      }
    };
    // Provider picker: fill the base URL (+ default model) for a chosen preconfigured provider.
    App.prototype.pickProvider = function (id) {
      var p = null; for (var i = 0; i < PROVIDERS.length; i++) if (PROVIDERS[i].id === id) p = PROVIDERS[i];
      this.setState(function (st) {
        st.settingsInput.provider = id;
        if (p && p.base) st.settingsInput.base = p.base;
        if (p && p.models && p.models.length && (!st.settingsInput.model || PROVIDERS.indexOf(p) >= 0)) {
          // only auto-fill the model if the current one isn't already in this provider's list
          if (p.models.indexOf(st.settingsInput.model) < 0) st.settingsInput.model = p.models[0];
        }
        return { settingsInput: st.settingsInput };
      });
      this.scheduleProbe();                   // B11: a new base URL re-probes (local servers need no key)
    };
    App.prototype.saveSettings = async function () {
      var si = this.state.settingsInput;
      // U39: the persist checkbox decides whether the bridge writes ~/.hermes/config.yaml
      // or applies the change to this bridge run only.
      if (this.state.cfgSaving) return;
      var cur = this.state.settings || {}, kp = !!this._keyPrompt;
      var sameBase = !si.base || String(si.base).replace(/\/+$/, "") === String(cur.base || "").replace(/\/+$/, "");
      var curFree = cur.keySource === "free" && sameBase;
      if (kp && !si.key && !(cur.keySet && sameBase && !curFree) && !(this.probeReady(si, cur) && !curFree)) { this.toast("Paste the API key first (blank is only OK for a local server)", "error"); return; }
      var extra = { persist: si.persistCfg !== false };
      if (si.model) extra.model = si.model;
      if (si.base) extra.base = si.base;
      if (si.key) extra.key = si.key;
      this.setState({ cfgSaving: true });
      var resp = await this.wsCall("config_set", extra);
      if (resp && resp.needConfirm) {
        // bridge refused a base-URL change while the stored key would follow it — ask the user
        if (await this.askModal({ title: "Send the stored key elsewhere?", body: resp.warn || "Send the stored API key to the new base URL?", okLabel: "Send key", danger: true })) {
          extra.confirm = true;
          resp = await this.wsCall("config_set", extra);
        } else { this.setState({ cfgSaving: false }); return; }
      }
      this.setState({ cfgSaving: false });
      if (!resp) { this.toast("Save failed — bridge not reachable", "error"); return; }
      if (resp && !resp.needConfirm) {
        this.setState({ settings: resp, settingsInput: { model: resp.model, base: resp.base, key: "", revealKey: false, provider: si.provider, persistCfg: si.persistCfg, bLabel: si.bLabel, bUrl: si.bUrl, bToken: si.bToken } });
        // verify with the stored key (the bridge only ever sends it to the stored base) so the toast is honest
        var t = await this.wsCall("config_test", {}, 15000);
        if (t && t.ok) { this.toast("✓ connected · model " + resp.model, "ok"); if (kp) this.closeSettings(); }
        else this.toast("Saved, but the endpoint check failed: " + ((t && (t.detail || ("HTTP " + t.status))) || "bridge not reachable") + (kp ? " — fix the key or URL and Save again" : ""), "error");
      }
    };
    App.prototype.revealKey = async function () {
      // two-step reveal: arm mints a single-use 5s nonce on the bridge, then the reveal
      // presents it — a drive-by can no longer pull the key in one silent request
      var armed = await this.wsCall("config_reveal_arm", {});
      var resp = await this.wsCall("config_reveal", { nonce: armed && armed.nonce });
      if (resp && resp.key) this.setState(function (st) { st.settingsInput.key = resp.key; return { settingsInput: st.settingsInput }; });
      else if (resp && resp.error) this.toast(resp.error, "error");
    };
    // B11: the endpoint form probes itself. Once the URL and a key are filled (or the URL is a local/private
    // server, or the bridge already holds a key for that base) a debounced config_test fetches the model list
    // and the round-trip time; stale replies are dropped by sequence number. Nothing is saved by a probe.
    App.prototype.probeReady = function (si, cfg) {
      si = si || this.state.settingsInput; cfg = cfg || this.state.settings || {};
      var base = (si.base || "").trim();
      if (!/^https?:\/\/\S+$/.test(base)) return false;
      if (si.key) return true;
      if (cfg.keySet && cfg.base && base.replace(/\/+$/, "") === String(cfg.base).replace(/\/+$/, "")) return true;   // stored key, same base (bridge-guarded)
      return /^https?:\/\/(localhost|127\.|0\.0\.0\.0|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.|\[::1\]|[^/:]+\.local)(:|\/|$)/i.test(base);   // local servers rarely need a key
    };
    App.prototype.scheduleProbe = function (si, cfg) {
      var self = this; clearTimeout(this._probeT);
      if (!this.probeReady(si, cfg)) {
        if (this.state.probe && this.state.probe.st !== "idle") this.setState({ probe: { st: "idle", ms: 0, models: [], detail: "", host: "" } });
        return;
      }
      this._probeT = setTimeout(function () { self.runProbe(false); }, 500);
    };
    App.prototype.runProbe = async function (manual) {
      var si = this.state.settingsInput, seq = (this._probeSeq = (this._probeSeq || 0) + 1), prev = this.state.probe || { models: [] };
      var host = (si.base || "").replace(/^https?:\/\//, "").replace(/\/.*$/, "");
      this.setState({ probe: { st: "busy", ms: 0, models: prev.host === host ? prev.models : [], detail: "", host: host }, cfgTesting: true });
      var extra = {};
      if (si.base) extra.base = si.base;
      if (si.key) extra.key = si.key;
      var resp = await this.wsCall("config_test", extra, 15000);
      if (seq !== this._probeSeq) return;                                     // a newer probe superseded this one
      var p = !resp ? { st: "fail", ms: 0, models: [], detail: "bridge not reachable", host: host }
        : resp.ok ? { st: "ok", ms: resp.ms || 0, models: resp.models || [], detail: resp.detail || "", host: host }
        : { st: "fail", ms: resp.ms || 0, models: [], detail: resp.detail || ("HTTP " + resp.status), host: host };
      this.setState({ probe: p, cfgTesting: false });
      if (manual) this.toast(p.st === "ok" ? "Connection OK — " + p.detail + " · " + p.ms + " ms" : "Connection failed — " + p.detail, p.st === "ok" ? "ok" : "error");
    };
    // U39: probe the endpoint (form values win over the live config) WITHOUT saving anything.
    App.prototype.testConnection = function () { if (!this.state.cfgTesting) this.runProbe(true); };
    App.prototype.renderProbe = function () {
      var p = this.state.probe; if (!p || p.st === "idle") return null;
      if (p.st === "busy") return html`<div class="probe busy" role="status" aria-live="polite"><span class="probe-spin"></span> retrieving models from <b>${p.host}</b><span class="dots"></span></div>`;
      if (p.st === "ok") return html`<div class="probe ok" role="status" aria-live="polite">✓ <b>${p.host}</b> · ping <span class=${"ping " + (p.ms < 300 ? "fast" : p.ms < 1000 ? "mid" : "slow")}>${p.ms} ms</span> · ${p.models.length ? p.models.length + (p.models.length === 1 ? " model" : " models") + " — pick one below" : "reachable, no model list"}</div>`;
      return html`<div class="probe fail" role="status" aria-live="polite">✗ <b>${p.host}</b> · ${p.detail}${p.ms ? " · " + p.ms + " ms" : ""}</div>`;
    };

    // ── Loops (Ralph-style recurring agent runs) ──────────────────────────────────────
    App.prototype.loadLoops = function () {
      try { this.setState({ loops: JSON.parse(localStorage.getItem("iris_loops") || "[]") }); } catch (e) {}
    };
    App.prototype.saveLoops = function () {
      try { localStorage.setItem("iris_loops", JSON.stringify(this.state.loops)); } catch (e) { this.toast("Could not persist loops (storage unavailable)", "error"); }
    };
    App.prototype.createLoop = function () {
      var le = this.state.loopEditor;
      if (!le.name.trim() || !le.prompt.trim()) return;
      var loop = { id: "loop_" + Date.now(), name: le.name.trim(), prompt: le.prompt.trim(),
        intervalSec: Math.max(10, parseInt(le.intervalSec, 10) || 300), active: true, iterations: 0, lastRun: 0,
        session: CFG.session };   // loop ownership (improve.md #16): fires only for this session
      this.setState(function (st) { st.loops = st.loops.concat([loop]); return { loops: st.loops, loopEditor: { name: "", prompt: "", intervalSec: 300 } }; },
        this.saveLoops);
      this.tickLoops();
    };
    App.prototype.toggleLoop = function (id) {
      this.setState(function (st) { st.loops = st.loops.map(function (l) { return l.id === id ? Object.assign({}, l, { active: !l.active }) : l; }); return { loops: st.loops }; }, this.saveLoops);
    };
    App.prototype.deleteLoop = function (id) {
      this.setState(function (st) { st.loops = st.loops.filter(function (l) { return l.id !== id; }); return { loops: st.loops }; }, this.saveLoops);
    };
    // fire any due loops; each loop re-sends its prompt as a user message
    App.prototype.tickLoops = function () {
      var self = this;
      var now = Date.now();
      self.state.loops.forEach(function (loop) {
        if (!loop.active) return;
        // Loop ownership (improve.md #16): a loop fires only in the window whose ACTIVE
        // session is the one it was created for — never into "whatever session is open".
        // (Legacy loops without a session tag keep the old fire-anywhere behavior.)
        if (loop.session && loop.session !== CFG.session) return;
        if (now - loop.lastRun < loop.intervalSec * 1000) return;
        if (self.state.running) return; // don't pile up while agent is mid-turn
        // Cross-window claim (improve.md #16): re-read the PERSISTED lastRun and claim this
        // tick before firing (best-effort compare-and-set over localStorage), so two windows
        // sharing the loop store can't both run the same interval.
        try {
          var persisted = JSON.parse(localStorage.getItem("iris_loops") || "[]");
          var pl = null;
          for (var i = 0; i < persisted.length; i++) if (persisted[i].id === loop.id) pl = persisted[i];
          if (pl && now - (pl.lastRun || 0) < loop.intervalSec * 1000) {
            // another window already fired this interval — adopt its counters, don't double-fire
            self.setState(function (st) { st.loops = st.loops.map(function (l) { return l.id === loop.id ? Object.assign({}, l, { lastRun: pl.lastRun, iterations: pl.iterations || l.iterations }) : l; }); return { loops: st.loops }; });
            return;
          }
          if (pl) { pl.lastRun = now; pl.iterations = (pl.iterations || 0) + 1; localStorage.setItem("iris_loops", JSON.stringify(persisted)); }
        } catch (e) {}
        // fire it
        self.setState(function (st) { st.loops = st.loops.map(function (l) { return l.id === loop.id ? Object.assign({}, l, { lastRun: now, iterations: l.iterations + 1 }) : l; }); return { loops: st.loops }; }, self.saveLoops);
        self.add({ role: "user", content: "[loop: " + loop.name + "] " + loop.prompt });
        Promise.resolve().then(function () { self.runAgent(); });
      });
    };
    App.prototype.startLoopTicker = function () {
      if (this._loopTimer) return;
      var self = this;
      this._loopTimer = setInterval(function () { self.tickLoops(); }, 5000);
    };

    // ── Terminal tabs (multiple VT instances, one shared PTY) ─────────────────────────
    App.prototype.openTerminalTab = function () {
      if (CFG.demo) { this.demoUnlock(); return; }
      var self = this;
      var id = "term_" + Date.now();
      var vt = this._wireVt(new VT(80, 24), id);
      this.setState(function (st) { st.termTabs = st.termTabs.concat([{ id: id, vt: vt, title: "term " + (st.termTabs.length + 1) }]); return { termTabs: st.termTabs, activeTerm: id }; },
        function () { self.fitPty(); self.openPty(); });   // B4: fit the fresh VT to the pane first so pty_open spawns at the real size (a tab opened beside chat never got a fit)
    };
    // wire a tab's VT to its pty_id (alt-screen reports feed the bridge's vim-guard for pty_exec)
    App.prototype._wireVt = function (vt, id) {
      var vself = this;
      vt.onAlt = function (alt) { vself._selClear(); if (vself.ws && vself.ws.readyState === 1) vself.ws.send(JSON.stringify({ type: "pty_mode", pty_id: id, altScreen: alt })); };
      // B3: terminal replies (DA/DSR/CPR/colour queries) go back to THIS shell, never the active tab
      vt.onReply = function (s) { vself.ptySendTo(id, s); };
      vt.onBell = function () { vself.vtBell(id); };
      // B5: shell-integration marks (OSC 133) + cwd (OSC 7) → tab titles, badges, notifications
      vt.onMark = function (m) { vself._onVtMark(id, vt, m); };
      vt.onCwd = function () { vself._termTitlesChanged(); };
      return vt;
    };
    App.prototype._termTitlesChanged = function () {
      var self = this; if (this._titleRaf) return;
      this._titleRaf = requestAnimationFrame(function () { self._titleRaf = null; self.setState({}); });
    };
    App.prototype._tabFor = function (id) { var t = this.state.termTabs; for (var i = 0; i < t.length; i++) if (t[i].id === id) return t[i]; return null; };
    // Tab title: a custom name wins, then cwd basename ⎇ branch from shell integration, then the app's OSC title
    App.prototype.termTabTitle = function (tt) {
      if (tt.custom) return tt.title;
      var vt = tt.vt;
      if (vt && vt.cwd) { var base = vt.cwd.replace(/\/+$/, "").split("/").pop() || "/"; return base + (vt.branch ? " ⎇ " + vt.branch : ""); }
      return (vt && vt.title) || tt.title;
    };
    App.prototype._termVisible = function (id) {
      var st = this.state; if (st.activeTerm !== id || document.hidden) return false;
      return st.view === "terminal" || (st.view === "chat" && st.termTabs.length > 0);
    };
    // A command finished (D mark): badge a background tab, announce it, notify when it ran ≥ 3 s out of sight
    App.prototype._onVtMark = function (id, vt, m) {
      if (m.k === "C") { vt._cmdStart = m.t; vt._busy = true; this._termTitlesChanged(); return; }   // B5b: busy dot on the tab
      if (m.k === "A") { this._termTitlesChanged(); return; }

    // Build a compact digest of every job (current session + all sub-agents + session list).

    App.prototype.renderDecisionsPanel = function () {

    // ── todo: pure client-side TodoStore (upstream tools/todo_tool.py). One list per

    // ── clarify: pause the loop, render a question (choices + free-text), resume on answer

    // ── memory: file-backed, char-capped, §-delimited entries under ~/.hermes/memories/

    // ── skills: ~/.hermes/skills/<cat>/<name>/SKILL.md with YAML frontmatter (name+desc).
    // Index (name+desc) is injected into the prompt; bodies load on demand via skill_view
    // (upstream tools/skill_manager_tool.py / skills_tool.py).
    App.prototype.parseFrontmatter = function (text) {
      // returns {name, description} from a leading --- ... --- YAML block (minimal parser:
      // scalar and block-scalar | / > for description, which upstream allows multiline).
      var out = { name: "", description: "" };
      var m = /^---\s*\n([\s\S]*?)\n---/.exec(text || "");
      if (!m) return out;
      var lines = m[1].split("\n");
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        var kv = /^([A-Za-z_][\w-]*):\s*(.*)$/.exec(line);
        if (!kv) continue;
        var key = kv[1], val = kv[2];
        if (key !== "name" && key !== "description") continue;
        if (val === "|" || val === ">" || val === "|-" || val === ">-") {
          var block = [];
          for (var k = i + 1; k < lines.length; k++) {
            if (/^\s+\S/.test(lines[k]) || lines[k].trim() === "") block.push(lines[k].replace(/^\s+/, ""));
            else break;
          }
          val = block.join(" ").trim();
        } else {
          val = val.replace(/^["']|["']\s*$/g, "").trim();
        }
        out[key] = val;
      }
      return out;
    };
    App.prototype.loadSkillsIndex = async function () {
      var ls = await this.exec("find " + hqp(SKILLS_DIR) + " -name SKILL.md 2>/dev/null | head -n " + MAX_SKILLS_INDEXED, true);
      var paths = (ls.output || "").split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
      var idx = [];
      for (var i = 0; i < paths.length; i++) {
        var head = await this.exec("head -c 4000 -- " + shq(paths[i]) + " 2>/dev/null", true);
        var fm = this.parseFrontmatter(head.output || "");
        var dir = paths[i].replace(/\/SKILL\.md$/, "");
        var name = fm.name || dir.split("/").pop();
        idx.push({ name: name, description: fm.description || "", dir: dir });
      }
      this.skillsIndex = idx;
    };
    App.prototype.skillsIndexBlock = function (list) {
      list = list || this.skillsIndex;

      var lines = list.map(function (s) { return "    - " + s.name + (s.description ? ": " + s.description : ""); });
      return "## Skills (mandatory)\n" +
        "Before replying, scan the skills below. If a skill matches or is even partially " +

    // ── Sidebar: sessions (color-coded by worktree) + loops ──
    App.prototype.renderSidebar = function () {

      });
      var q = (s.sessionSearch || "").toLowerCase(), spm = this._sessProjMap();

                ${TOOLS.map(function (t) { var n = t.function.name, off = !!(s.toolsOff && s.toolsOff[n]), ic = s.irisCfg, o = ic && ic.tools && ic.tools[n] || "", eff = self.toolPerm(n);
                  return html`<label class="notif-toggle tool-tg" key=${n}><input type="checkbox" checked=${!off} title="on/off in this browser only" onChange=${function (e) { self.setToolOff(n, !e.target.checked); }} /><span>${n}</span>
                    ${ic ? html`<select class=${"perm-sel " + (o || "inherit")} title=${"bridge permission (shared with the TUI) · effective: " + eff} value=${o || "inherit"} onChange=${function (e) { var tl = {}; tl[n] = e.target.value; self.setIrisCfg({ tools: tl }); }}>
                      <option value="inherit" selected=${!o}>${"· " + eff}</option><option value="allow" selected=${o === "allow"}>allow</option><option value="ask" selected=${o === "ask"}>ask</option><option value="deny" selected=${o === "deny"}>deny</option></select>` : null}</label>`; })}
              </div>
              <span class="hint">Checkbox = this browser only (unchecked tools leave the model's list). The dropdown is the bridge permission shared with the TUI (${"~/.hermes/config.yaml"} iris.tools): <b>allow</b> runs, <b>ask</b> shows an approval card, <b>deny</b> hides the tool from the model; "·" inherits from the approval mode. ${(function () { var k = Object.keys(s.toolsOff || {}).filter(function (x) { return s.toolsOff[x]; }); return k.length ? "Off here: " + k.join(", ") + "." : ""; })()}</span></div>
            <div class="field"><label>Max agent iterations per turn</label>
              <input type="number" min="1" max="200" step="1" value=${s.maxIters}
                onChange=${function (e) { self.setMaxIters(e.target.value); }} />
              <span class="hint">Tool-calling loop budget per user message (default 24; upstream ships 90). A live run picks a change up at its next iteration. Stored on this device.</span></div>
            <div class="field"><label>Sampling temperature</label>
              <input type="number" min="0" max="2" step="0.1" value=${s.tempPref}
                onChange=${function (e) { self.setTemp(e.target.value); }} />
              <span class="hint">Applies to the main loop and sub-agents (default 0.7). Summarizer/utility calls stay at 0.3. Stored on this device.</span></div>
            </div></details>
            <details class="sg" open=${!self.webMode()}><summary>${self.webMode() ? "Advanced · " : ""}Bridge · shared with the TUI</summary><div class="sgb">
            <div class="field brg"><label>Bridge · shared with the TUI</label>
              ${(function () {
                var c = s.irisCfg; if (!c) return html`<span class="hint">Bridge offline — these knobs live in the bridge process (iris: block of ~/.hermes/config.yaml).</span>`;
                var num = function (k, lo, hi, step, w) { return html`<input type="number" min=${lo} max=${hi} step=${step} value=${c[k]} style=${"width:" + (w || 110) + "px"} onChange=${function (e) { var o = {}; o[k] = e.target.value; self.setIrisCfg(o); }} />`; };
                return html`<div class="hint brg-expl"><b>AUTO</b> runs every tool without asking · <b>ASK</b> asks before side-effecting tools (write, shell, …) · <b>STEP</b> asks before every single call.<br /><b>Thinking on</b>: the model reasons before it answers (slower, usually better) · <b>off</b>: it answers straight away.</div>
                <div class="brg-grid">
                  <label class="sub"><span>Approval mode</span><select value=${c.approve} onChange=${function (e) { self.setIrisCfg({ approve: e.target.value }); }}>
                    <option value="auto" selected=${c.approve === "auto"}>auto — run everything</option><option value="ask" selected=${c.approve === "ask"}>ask — approve side-effecting tools</option><option value="step" selected=${c.approve === "step"}>step — approve every call</option></select></label>
                  <label class="sub"><span>Thinking</span><span class="set-row"><label class="notif-toggle"><input type="checkbox" checked=${!!c.thinking} onChange=${function (e) { self.setIrisCfg({ thinking: e.target.checked }); }} /><span>${c.thinking ? "on" : "off (enable_thinking=false)"}</span></label></span></label>
                  <label class="sub"><span>Think budget (tokens · 0 = unlimited)</span>${num("think_budget", 0, 200000, 256)}</label>
                  <label class="sub"><span>Sampling temperature</span>${num("temperature", 0, 2, 0.05, 90)}</label>
                  <label class="sub"><span>Repeat penalty (0 = server default)</span>${num("repeat_penalty", 0, 3, 0.05, 90)}</label>
                  <label class="sub"><span>LLM call timeout (s)</span>${num("llm_timeout_s", 60, 86400, 60)}</label>
                  <label class="sub"><span>Model context window (tokens)</span>${num("ctx_tokens", 4096, 10000000, 1024)}</label>
                  <label class="sub"><span>Compaction reserve (tokens)</span>${num("compact_reserve", 1024, 1000000, 1024)}</label>
                  <label class="sub"><span>TUI max iterations per turn</span>${num("max_iters", 4, 200, 1, 90)}</label>
                  <label class="sub"><span>TUI compaction trigger (chars · 0 = auto ${((c.ctx_tokens - c.compact_reserve) * 4).toLocaleString()})</span>${num("ctx_budget", 0, 100000000, 10000)}</label>
                </div>
                <label class="sub" style="display:block;margin-top:8px"><span>Compaction prompt (blank = built-in)</span>
                  <textarea class="instr" rows="3" maxlength="4000" placeholder=${c.compact_default} value=${c.compact_prompt || ""} onChange=${function (e) { self.setIrisCfg({ compact_prompt: e.target.value }); }}></textarea></label>
                <span class="hint">Saved to the iris: block of ~/.hermes/config.yaml and applied live${c.tui ? " — a TUI runs in this bridge and follows along" : ""}. Thinking, sampling, timeout and the compaction knobs are process-wide (this page's turns and the TUI); the client-side think budget cuts the TUI's stream. The page's own "Max agent iterations" and "Sampling temperature" above stay browser-local.</span>`;
              })()}
            </div>
            </div></details>
            <details class="sg"><summary>${self.webMode() ? "Advanced · " : ""}Bridges (multi-bridge manager)</summary><div class="sgb">
            <div class="field"><label>Bridges (multi-bridge manager)</label>
              ${(s.bridges || []).map(function (b) {
                var bst = s.bridgeStatus[b.id] || "off";
                return html`<div class="set-row bridge-row" key=${b.id}>
                  <span class=${"sb-bstat " + bst} title=${bst}></span>
                  <span class="bridge-lbl">${b.label}</span>
                  <span class="bridge-url">${b.url}</span>
                  ${bst !== "on" ? html`<button type="button" class="ghost" onClick=${function () { self.bridgeConnect(b); }}>Retry</button>` : null}
                  <button type="button" class="ghost" onClick=${function () { self.removeBridge(b.id); }}>✕</button>
                </div>`;
              })}
              <div class="set-row">
                <input type="text" placeholder="label" style="flex:0 0 84px" value=${si.bLabel}
                  onInput=${function (e) { self.setState(function (st) { st.settingsInput.bLabel = e.target.value; return { settingsInput: st.settingsInput }; }); }} />
                <input type="text" placeholder="ws://127.0.0.1:1416 — or just the port" value=${si.bUrl}
                  onInput=${function (e) { self.setState(function (st) { st.settingsInput.bUrl = e.target.value; return { settingsInput: st.settingsInput }; }); }} />
                <input type="password" placeholder="token" style="flex:0 0 104px" value=${si.bToken}
                  onInput=${function (e) { self.setState(function (st) { st.settingsInput.bToken = e.target.value; return { settingsInput: st.settingsInput }; }); }} />
                <button type="button" onClick=${function () { self.addBridge(si.bLabel, si.bUrl, si.bToken); self.setState(function (st) { st.settingsInput.bLabel = ""; st.settingsInput.bUrl = ""; st.settingsInput.bToken = ""; return { settingsInput: st.settingsInput }; }); }}>Add</button>
              </div>
              <div class="set-row">
                <button type="button" class="ghost" onClick=${function () {
                  var info = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + " " + CFG.token;
                  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(info); } catch (e) {}
                  self.toast("Copied — paste into another Iris page's bridge URL field", "ok");
                }}>Copy this bridge's address + token</button>
              </div>
              <span class="hint">Connect additional Iris bridges (other worktrees or machines, each on its own port + token). Their sessions join the sidebar and Fleet and open as live floating windows; chat, terminals and the LLM stay on this page's own bridge. To wire two bridges together, open the other bridge's page and use its "Copy" button, then paste here (the URL field accepts "url token" in one paste). Stored on this device.</span></div>
            </div></details>
          </div>
          <div class="modal-foot">
            <button type="button" class="ghost" onClick=${function () { self.closeSettings(); }}>Cancel</button>
            <button type="button" class="ghost" disabled=${s.cfgTesting} onClick=${this.testConnection.bind(this)}>${s.cfgTesting ? "Testing…" : "Test connection"}</button>
            <button type="button" onClick=${this.saveSettings.bind(this)}>${si.persistCfg !== false ? "Save & Persist" : "Save (this run only)"}</button>
          </div>
        </div>
      </div>`;
    };
    return App;
  })();

  // Expose the mounted instance for the CDP test harness (tests.ts) and console debugging.
  // Preact class components surface on the DOM child's __c internal; a ref is cleaner.
  render(h(App, { ref: function (inst) { window.APP = inst; } }), document.getElementById("app"));
})();
</script>
</body>
</html>
